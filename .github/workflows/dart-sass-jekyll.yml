name: Build & deploy (Dart Sass + Jekyll)

on:
  push:
    branches: [ master ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Bundler & gems
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site

      - name: Set up Node (for Dart Sass)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dart Sass
        run: npm install -g sass

      - name: Compile SCSS with Dart Sass (overwrite generated CSS)
        run: |
          mkdir -p _site/assets/css
          # Compile the main SCSS partial directly; this outputs the final site CSS and overwrites Jekyll's generated CSS
          sass --no-source-map _sass/main.scss:_site/assets/css/styles.css --style=compressed

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
